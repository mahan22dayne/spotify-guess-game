<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حدس آهنگ — بازی پلی‌لیست</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="stage-bg" aria-hidden="true"></div>

<section id="screen-setup" class="screen active">
  <div class="setup-card">
    <p class="eyebrow">بازی حدس آهنگ</p>
    <h1>چقدر آهنگ‌های پلی‌لیستت رو بلدی؟</h1>
    <p class="lede">لینک یه پلی‌لیست عمومی از اسپاتیفای یا دیزر رو بذار، بعد یه تکه کوچیک از هر آهنگ پخش می‌شه — هرچی زودتر حدس بزنی، امتیاز بیشتری می‌گیری.</p>

    <form id="form-load">
      <input
        type="text"
        id="input-url"
        placeholder="لینک پلی‌لیست اسپاتیفای یا دیزر..."
        autocomplete="off"
        required
      />
      <button type="submit" id="btn-load">بارگذاری پلی‌لیست</button>
    </form>

    <p id="setup-status" class="setup-status"></p>
  </div>
</section>

<section id="screen-game" class="screen">
  <header class="hud">
    <div class="hud-item">
      <span class="hud-label">دور</span>
      <span class="hud-value"><span id="round-current">1</span>/<span id="round-total">10</span></span>
    </div>
    <div class="hud-item">
      <span class="hud-label">امتیاز</span>
      <span class="hud-value" id="score">0</span>
    </div>
  </header>

  <div class="player">
    <button id="btn-play" class="play-ring" type="button" aria-label="پخش تکه‌ی آهنگ">
      <svg viewBox="0 0 120 120" class="ring-svg">
        <circle class="ring-track" cx="60" cy="60" r="52" />
        <circle class="ring-progress" id="ring-progress" cx="60" cy="60" r="52" />
      </svg>
      <span class="play-icon" id="play-icon">▶</span>
      <span class="play-time" id="play-time">۰.۵ث</span>
    </button>

    <div class="bars" id="bars" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="attempts" id="attempts">
      <span class="attempt-dot" data-stage="0"></span>
      <span class="attempt-dot" data-stage="1"></span>
      <span class="attempt-dot" data-stage="2"></span>
      <span class="attempt-dot" data-stage="3"></span>
    </div>
  </div>

  <div class="guess-box">
    <div class="autocomplete-wrap">
      <input
        type="text"
        id="input-guess"
        placeholder="اسم آهنگ رو تایپ کن..."
        autocomplete="off"
      />
      <ul id="suggestions" class="suggestions"></ul>
    </div>
    <div class="guess-actions">
      <button id="btn-submit-guess" type="button" class="btn-primary">حدس بزن</button>
      <button id="btn-skip-stage" type="button" class="btn-ghost">این تیکه بسمه، طولانی‌ترش کن</button>
      <button id="btn-giveup" type="button" class="btn-ghost">تسلیم می‌شم، جواب رو بگو</button>
    </div>
  </div>

  <div id="reveal" class="reveal">
    <img id="reveal-img" class="reveal-img" alt="" />
    <div class="reveal-info">
      <p class="reveal-verdict" id="reveal-verdict"></p>
      <p class="reveal-track" id="reveal-track"></p>
      <p class="reveal-artist" id="reveal-artist"></p>
    </div>
    <button id="btn-next" class="btn-primary" type="button">دور بعدی</button>
  </div>
</section>

<section id="screen-end" class="screen">
  <div class="setup-card">
    <p class="eyebrow">تمام شد</p>
    <h1 id="end-headline">نتیجه‌ی بازی</h1>
    <p class="lede" id="end-summary"></p>
    <button id="btn-restart" class="btn-primary">یه بار دیگه با همین پلی‌لیست</button>
    <button id="btn-new-playlist" class="btn-ghost">پلی‌لیست جدید</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
